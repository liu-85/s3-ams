; PlatformIO Project Configuration File
;
;   s3-ams —— 合并项目
;   Tianshu (RP2040 + 8路独立电机 + 1微动) 的 BambuBus 协议逻辑
;   + esp32s3-485 的硬件架构 (ESP32-S3 + 1电机+8电磁离合 + 双微动电阻编码 + Web)
;
;   平台: ESP32-S3
;   框架: Arduino (保留 Tianshu 的 C++ BambuBus 代码)
;   构建目标: 在线编译 (GitHub Actions / PlatformIO CI)
;
;   ⚠ 硬件配置对齐 esp-ams-s3（纯 ESP-IDF，CONFIG_SPIRAM=n，16MB flash）：
;   实际硬件是 16MB Flash + 不开 PSRAM。固件头若标了 PSRAM/QIO，
;   ROM boot 时跟芯片物理配置对不上 → SHA-256 校验失败 + GPIO0 看门狗循环重启。
;   因此下面**不写** BOARD_HAS_PSRAM / qio_opi，flash_size 用 16MB。

[platformio]
default_envs = s3ams

[env:s3ams]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; 使用 Arduino 框架，保留 Tianshu 的 C++ 代码
board_build.flash_size = 16MB
board_build.partitions = partitions_16mb.csv
monitor_speed = 115200

; 编译选项（对齐 esp-ams-s3：不开 PSRAM，避免固件头标 PSRAM 导致 ROM 校验失败）
build_flags =
    -D ARDUINO_ARCH_ESP32
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ARDUHAL_LOG_DEFAULT_LEVEL=3
    -D CONFIG_ESP32S3_DEFAULT_CPU_FREQ_MHZ=240

; 上传选项
upload_protocol = esp-builtin
upload_speed = 921600

; 串口监视
monitor_filters = esp32_exception_decoder

; 依赖库
; Web 服务器使用 ESP32 Arduino 内置的 WebServer 和 WiFi 库，无需额外依赖
; NVS 使用 ESP32 Arduino 内置的 Preferences 库
; CRC 使用本地 lib/CRC（随仓库提交）
; 注：不再需要 NeoPixel（板载普通 LED）与 PubSubClient（485 直连无 MQTT）

; 不需要 PCF8575 / SSD1306 / AS5600 (新硬件没有这些)
; 不需要 U8g2 (没有 OLED 屏)

; 排除不需要的源文件（新硬件无 OLED / PCF8575 / AS5600）
; 用 build_src_filter（src_filter 已废弃）
build_src_filter =
    +<*.cpp>
    +<*.c>
    -<PCF8575_PinMap.*>
    -<ssd1306_display.*>
